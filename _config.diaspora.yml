# Diaspora 主题配置
# 说明：此文件在根目录，Hexo 会自动合并到 theme config，升级主题不会丢失配置

# 头部菜单，title: link
menu:
  首页: /
  分类: /categories
  标签: /tags
  归档: /archives
  关于: /about

# 是否显示目录
TOC: false

# 是否自动播放音乐
autoplay: false

# 默认音乐（随机播放）
mp3:
  - http://link.hhtjim.com/163/425570952.mp3
  - http://link.hhtjim.com/163/425570952.mp3

# 首页封面图
welcome_cover: /img/welcome-cover.jpg

# 默认文章封面图（随机调用）
cover:
  - /img/cover.jpg
  - /img/welcome-cover.jpg

# Twitter 分享卡片
twitterpic:
  enable: false
  src: https://bangdream.moe/img/ident.png
  creatorid: yourtwitteridhere

# 是否使用 mathjax
mathjax: false

# 是否关闭默认滚动条
scrollbar: true

# 本地搜索（索引由 hexo-generator-searchdb 生成到 /search.xml）
local_search:
  enable: true

# 是否显示一言
hitokoto: true

# 链接
links:
  facebook: /
  twitter: /
  github: /
  wechat: /img/logo.png
  email: mailto:484878694@qq.com

# 备案（个人站点无需备案，保持关闭）
beian:
  enable: false
  enableFooter: false
  beianInfo: ''
  link: http://www.beian.miit.gov.cn

# Gitalk 评论插件
gitalk:
  enable: false
  autoExpand: false
  clientID: ''
  clientSecret: ''
  repo: ''
  owner: ''
  admin: ['']
  id: location.pathname
  distractionFreeMode: false

# 网站关键字
keywords: Fechin

# Google Analytics
google_analytics:

# 网站 ico
favicon: /img/favicon.png

# rss 文件
rss: atom.xml

# 版权信息
copyright:
  enable: false
  license: "CC BY-NC-ND"
